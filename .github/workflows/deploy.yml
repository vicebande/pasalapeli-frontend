name: Deploy frontend a EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gate (SonarQube Cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analizar y esperar al Quality Gate (bloquea el deploy)
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.qualitygate.wait=true

  deploy:
    name: Build y deploy a EC2
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Preparar EC2-WEB y desplegar frontend
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          EC2_APPS_HOST: ${{ vars.EC2_APPS_HOST || '' }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || '00000000-0000-0000-0000-000000000000' }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || 'common' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || '' }}
          EC2_DOMAIN: ${{ vars.EC2_DOMAIN || '' }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL || '' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 90m
          envs: REPO_OWNER,EC2_APPS_HOST,AZURE_CLIENT_ID,AZURE_TENANT_ID,APP_BASE_URL,EC2_DOMAIN,CERTBOT_EMAIL
          script: |
            set -euo pipefail

            # --- BUILD LOCAL ANGULAR EN GITHUB RUNNER ---
            # Esto es MUCHO más rápido que build en la EC2 t2.micro
            cd /github/workspace

            echo "==> Instalando dependencias del frontend"
            npm ci

            echo "==> Construyendo Angular en producción"
            CI=false npm run build -- --configuration production

            echo "==> Archivos generados en dist/pasa-la-peli-frontend/browser"
            ls -la dist/pasa-la-peli-frontend/browser

            # --- DEPLOY A EC2 USANDO bootstrap-web.sh ---
            # Este script instala Docker, genera certificados, configura .env,
            # y levanta el contenedor nginx con la config correcta.
            echo "==> Descargando bootstrap-web.sh desde pasalapeli-database"
            curl -fsSL "https://raw.githubusercontent.com/$REPO_OWNER/pasalapeli-database/main/scripts/bootstrap-web.sh" -o /tmp/bootstrap-web.sh
            if [ $? -ne 0 ]; then
              echo "ERROR: No se pudo descargar bootstrap-web.sh. Verifica que REPO_OWNER es correcto y el archivo existe en main." >&2
              exit 1
            fi
            chmod +x /tmp/bootstrap-web.sh

            echo "==> Ejecutando bootstrap-web.sh en EC2"
            bash /tmp/bootstrap-web.sh

            if [ $? -ne 0 ]; then
              echo "ERROR: El bootstrap-script fallo. Revisa los logs arriba." >&2
              exit 1
            fi

            echo "==> Pulling latest code del repo frontend en EC2"
            cd /opt/pasalapeli/pasalapeli-frontend
            git fetch --prune origin
            git reset --hard origin/main

            echo "==> Build and restart frontend container"
            cd /opt/pasalapeli/pasalapeli-database
            EC2_APPS_HOST="$EC2_APPS_HOST" AZURE_CLIENT_ID="$AZURE_CLIENT_ID" AZURE_TENANT_ID="$AZURE_TENANT_ID" APP_BASE_URL="$APP_BASE_URL" docker compose -f docker-compose.web.yml up -d --build

            echo "==> Waiting for health check..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' pasalapeli-frontend 2>/dev/null || echo "starting")
              echo "    [$i/30] Status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "==> frontend HEALTHY"
                break
              fi
              sleep 5
            done
            if [ "$STATUS" != "healthy" ]; then
              echo "ERROR: frontend no quedo healthy tras 150s" >&2
              echo "==> docker logs (depuracion):" >&2
              docker logs pasalapeli-frontend 2>&1 | tail -50 >&2 || true
              docker inspect pasalapeli-frontend --format '{{json .State.Health}}' >&2 || true
              exit 1
            fi

            echo "==> Verificando HTTPS"
            if [ -n "$EC2_DOMAIN" ]; then
              curl -fsS -o /dev/null -w "https://$EC2_DOMAIN -> %{http_code}\n" "https://$EC2_DOMAIN/" || echo "WARN: HTTPS no responde aun"
            fi

            docker compose -f docker-compose.web.yml ps pasalapeli-frontend
            echo "==> Deploy completado exitoso"