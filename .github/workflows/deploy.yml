name: Deploy frontend a EKS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gate (SonarQube Cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analizar y esperar al Quality Gate (bloquea el deploy)
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.qualitygate.wait=true

  deploy:
    name: Deploy frontend to EKS
    needs: quality
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: pasalapeli-cluster
      ECR_IMAGE: 439738332704.dkr.ecr.us-east-1.amazonaws.com/pasalapeli-images/frontend:latest
      DEPLOYMENT_NAME: pasalapeli-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image (production configuration)
        run: |
          docker build \
            --build-arg AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
            --build-arg AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
            --build-arg APP_BASE_URL="${{ secrets.APP_BASE_URL }}" \
            --build-arg EC2_APPS_HOST=pasalapeli-bff-service \
            -t $ECR_IMAGE .
          docker push $ECR_IMAGE

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s-manifests/
          kubectl rollout restart deployment/$DEPLOYMENT_NAME
          kubectl rollout status deployment/$DEPLOYMENT_NAME --timeout=180s
