name: Deploy frontend a EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gate (SonarQube Cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analizar y esperar al Quality Gate (bloquea el deploy)
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.qualitygate.wait=true

  deploy:
    name: Build y deploy a EC2
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Preparar EC2-WEB y desplegar frontend
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          EC2_APPS_HOST: ${{ vars.EC2_APPS_HOST || '' }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || '00000000-0000-0000-0000-000000000000' }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || 'common' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || '' }}
          EC2_DOMAIN: ${{ vars.EC2_DOMAIN || '' }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL || '' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 90m
          envs: REPO_OWNER,EC2_APPS_HOST,AZURE_CLIENT_ID,AZURE_TENANT_ID,APP_BASE_URL,EC2_DOMAIN,CERTBOT_EMAIL
          script: |
            set -euo pipefail

            # --- BUILD LOCAL ANGULAR EN GITHUB RUNNER ---
            # Esto es MUCHO más rápido que build en la EC2 t2.micro
            cd /github/workspace

            echo "==> Instalando dependencias del frontend"
            npm ci

            echo "==> Construyendo Angular en producción"
            CI=false npm run build -- --configuration production

            echo "==> Archivos generados en dist/pasa-la-peli-frontend/browser"
            ls -la dist/pasa-la-peli-frontend/browser

            # --- ACTUALIZAR .env EN EC2 CON VALORES DE GITHUB VARIABLES ---
            # Esto asegura que el docker build use los ARG correctos (sobreescribe .env)
            echo "==> Actualizando archivo .env en EC2 con variables de GitHub"
            ENV_FILE="/opt/pasalapeli/pasalapeli-database/.env"
            
            # Función para actualizar variables en .env de forma robusta
            update_env_var() {
              local key="$1" val="$2"
              # Remover cualquier línea anterior con esta key (comentarios o valores)
              sed -i "/^${key}=/d" "$ENV_FILE" 2>/dev/null || true
              # Añadir nuevo valor al final (solo si no está vacío)
              if [ -n "$val" ]; then
                printf '%s=%s\n' "$key" "$val" >> "$ENV_FILE"
              fi
            }
            
            update_env_var "EC2_APPS_HOST" "$EC2_APPS_HOST"
            update_env_var "APP_BASE_URL" "$APP_BASE_URL"
            update_env_var "AZURE_CLIENT_ID" "$AZURE_CLIENT_ID"
            update_env_var "AZURE_TENANT_ID" "$AZURE_TENANT_ID"
            
            echo "==> Contenido actualizado del .env:"
            grep -E '^(EC2_APPS_HOST|APP_BASE_URL|AZURE_CLIENT_ID|AZURE_TENANT_ID)=' "$ENV_FILE" 2>/dev/null || echo "(ninguna clave encontrada)"
            
            # --- REBUILD Y RESTART DOCKER CONTAINER EN EC2 ---
            echo "==> Rebuild y restart contenedor Docker en EC2"
            cd /opt/pasalapeli/pasalapeli-database
            echo "==> Ejecutando docker compose con .env actualizado"
            docker compose -f docker-compose.web.yml up -d --build

            echo "==> Estado de contenedores"
            docker compose -f docker-compose.web.yml ps

            echo "==> Deploy completado exitoso"