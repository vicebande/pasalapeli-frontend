# SonarQube Cloud (CI bloqueante) - https://sonarcloud.io
sonar.projectKey=vicebande_pasalapeli-frontend
sonar.organization=vicebande
sonar.projectName=Pasa La Peli - Frontend

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.js
# El repo no tiene infra de unit tests (sin karma/jasmine/Chrome): Sonar
# reporta 0% en cualquier linea nueva de TS y el gate new_coverage (<80%)
# fallaria en cada cambio sin forma de cumplirlo. Se excluye la cobertura
# hasta incorporar tests + reporte lcov (entonces quitar src/**/*.ts de aqui).
sonar.coverage.exclusions=**/*.spec.ts,**/environment*.ts,src/**/*.ts
