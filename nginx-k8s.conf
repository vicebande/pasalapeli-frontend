server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|map)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Proxy para llamadas al BFF (el entrypoint real; no hay API Gateway)
    # El host se inyecta en build via ARG EC2_APPS_HOST (Dockerfile).
    #   - EKS / K8s:  EC2_APPS_HOST = bff-service (K8s DNS del servicio BFF)
    location ^~ /api/ {
        proxy_pass http://A_PONE_APPS_HOST:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
